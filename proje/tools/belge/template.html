<title>Purple Light Tasarım Belgesi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Rubik:wght@400;500;700&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* layout: a field manual — sticky contents rail on the left, one reading column with wide scrollable tables; section heads in the game's pixel type */
:root{
  --bg:#f6f3fa;--panel:#ffffff;--fg:#211b2c;--muted:#5e5470;--line:#ddd3ea;--accent:#7a3fd0;--accent-soft:#efe5fc;--zebra:#faf7fd;--mark:#ffe58a;
  --display:"Pixelify Sans","Courier New",monospace;--body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#120f19;--panel:#1b1724;--fg:#ece6f6;--muted:#a99dbd;--line:#302941;--accent:#b88cff;--accent-soft:#2a2140;--zebra:#17131f;--mark:#6a4fa8;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#120f19;--panel:#1b1724;--fg:#ece6f6;--muted:#a99dbd;--line:#302941;--accent:#b88cff;--accent-soft:#2a2140;--zebra:#17131f;--mark:#6a4fa8;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15.5px;line-height:1.6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:40px;max-width:1280px;margin:0 auto}
nav.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);align-self:start;max-height:calc(100vh - 62px);overflow:auto;padding-block:28px 28px;font-size:13.5px}
nav.toc .brand{font-family:var(--display);font-size:22px;color:var(--accent);line-height:1.1;margin:0 0 4px}
nav.toc .ver{color:var(--muted);font-size:12px;margin-bottom:16px}
nav.toc ul{list-style:none;margin:0;padding:0}
nav.toc li.h1{margin-top:10px}
nav.toc li.h1>a{font-weight:500;color:var(--fg)}
nav.toc li ul{border-left:2px solid var(--line);margin:4px 0 0 2px;padding-left:10px}
nav.toc li ul a{color:var(--muted)}
nav.toc a{text-decoration:none;display:block;padding:2px 0}
nav.toc a:hover,nav.toc a:focus-visible{color:var(--accent)}
main{min-width:0;padding-block:28px 0}
.mtoc{display:none}
h1,h2,h3,h4{text-wrap:balance;line-height:1.25}
h1{font-family:var(--display);font-weight:700;font-size:34px;color:var(--accent);margin:56px 0 12px;padding-top:12px;border-top:3px solid var(--line)}
#purple-light-tasarim-belgesi{border-top:none;margin-top:0;padding-top:0;font-size:42px}
h2{font-family:var(--display);font-weight:500;font-size:24px;margin:36px 0 10px}
h3{font-size:19px;margin:28px 0 8px;padding:6px 12px;background:var(--accent-soft);border-radius:6px}
h4{font-size:16px;margin:22px 0 6px;color:var(--accent)}
p,ul,ol{max-width:72ch}
li{margin:2px 0}
a{color:var(--accent)}
strong{font-weight:700}
code{font-family:var(--mono);font-size:.88em;background:var(--accent-soft);padding:1px 5px;border-radius:4px}
.tw{overflow-x:auto;margin:10px 0 18px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th{position:sticky;top:0;background:var(--panel);text-align:left;font-weight:500;color:var(--muted);font-size:12px;letter-spacing:.03em;border-bottom:2px solid var(--line);padding:8px 10px;white-space:nowrap}
td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top;min-width:60px}
td:first-child{font-weight:500;white-space:nowrap}
tbody tr:nth-child(even){background:var(--zebra)}
tr.hide{display:none}
mark{background:var(--mark);color:inherit;border-radius:2px}
.filt{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:14px 0 0}
.filt label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.filt input{flex:1 1 220px;max-width:420px;font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg)}
.filt input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.filt .cnt{font-size:12px;color:var(--muted)}
blockquote{margin:12px 0;padding:8px 14px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 6px 6px 0;max-width:72ch}
@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr);gap:0}
  nav.toc{display:none}
  .mtoc{display:block;margin:0 0 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:8px 12px}
  .mtoc summary{cursor:pointer;font-family:var(--display);color:var(--accent)}
  .mtoc ul{list-style:none;padding-left:0;font-size:14px}.mtoc li ul{padding-left:14px}
  .mtoc a{text-decoration:none}
  h1{font-size:28px}#purple-light-tasarim-belgesi{font-size:32px}
}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
/* v2.42: search across the whole document */
.gs{position:sticky;top:0;z-index:60;background:var(--bg);border-bottom:1px solid var(--line);max-width:1280px;margin:0 auto;padding:8px 0}
.gsin{display:flex;align-items:center;gap:6px}
.gsin input{flex:1 1 auto;min-width:0;font:inherit;font-size:15px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg)}
.gsin input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.gsin button{flex:none;font:inherit;font-size:15px;line-height:1;min-width:38px;height:38px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg);cursor:pointer}
.gsin button:hover,.gsin button:focus-visible{border-color:var(--accent);color:var(--accent)}
.gsc{flex:none;font-size:12px;color:var(--muted);white-space:nowrap;min-width:4.5em;text-align:right}
.gsr{position:absolute;left:0;right:0;top:100%;max-height:min(70vh,560px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-top:none;border-radius:0 0 10px 10px;box-shadow:0 14px 30px rgba(20,10,40,.28)}
.gsr[hidden]{display:none}
.gsr button{display:block;width:100%;text-align:left;font:inherit;font-size:14px;line-height:1.4;padding:8px 12px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--fg);cursor:pointer}
.gsr button:hover,.gsr button.on{background:var(--accent-soft)}
.gsr .ctx{display:block;font-size:11.5px;color:var(--muted);letter-spacing:.02em}
.gsr .hd{font-family:var(--display);color:var(--accent)}
.gsr .more{padding:8px 12px;font-size:12.5px;color:var(--muted)}
mark.gm{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
.gflash{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3,h4{scroll-margin-top:64px}
@media print{.gs{display:none}}
</style>
<div class="gs" id="gs" role="search"><div class="gsin"><input id="gsq" type="search" placeholder="Belgenin tamamında ara…  ( / )" aria-label="Belgenin tamamında ara" autocomplete="off" enterkeyhint="search"><span class="gsc" id="gsc" aria-live="polite"></span><button type="button" id="gsp" aria-label="Önceki sonuç" title="Önceki sonuç (↑)">↑</button><button type="button" id="gsn" aria-label="Sonraki sonuç" title="Sonraki sonuç (↓ ya da Enter)">↓</button><button type="button" id="gsx" aria-label="Aramayı temizle" title="Temizle (Esc)">×</button></div><div class="gsr" id="gsr" hidden></div></div>
<div class="layout">
<nav class="toc" aria-label="İçindekiler"><p class="brand">Purple Light</p><p class="ver">Tasarım belgesi · Versiyon {{VER}}</p>{{TOC}}</nav>
<main>
<details class="mtoc"><summary>İçindekiler</summary>{{TOC}}</details>
{{BODY}}
</main>
</div>
<script>
(function(){
  var lc=function(s){return (s||'').toLocaleLowerCase('tr-TR')};
  document.querySelectorAll('.filt input').forEach(function(inp){
    var wrap=document.getElementById(inp.getAttribute('data-t'));if(!wrap)return;
    var rows=Array.prototype.slice.call(wrap.querySelectorAll('tbody tr'));
    var cnt=document.getElementById('c'+inp.id.slice(1));
    var raw=rows.map(function(r){return r.innerHTML});
    var txt=rows.map(function(r){return lc(r.textContent)});
    var t=null;
    inp.addEventListener('input',function(){clearTimeout(t);t=setTimeout(run,120)});
    function run(){
      var q=lc(inp.value.trim()),n=0;
      rows.forEach(function(r,i){
        var hit=!q||txt[i].indexOf(q)>=0;r.classList.toggle('hide',!hit);
        if(hit){n++;r.innerHTML=raw[i]}
      });
      cnt.textContent=q?(n+' / '+rows.length+' satır'):(rows.length+' satır');
    }
  });
})();
</script>

<script>
/* v2.42: whole-document search: headings, paragraphs, list items and table rows; all words must match; Turkish letters are folded (ç=c, ı=i…) */
(function(){
  var inp=document.getElementById('gsq'),out=document.getElementById('gsr'),cnt=document.getElementById('gsc'),gs=document.getElementById('gs');
  if(!inp||!out)return;
  var MAP={'İ':'i','I':'i','ı':'i','Ç':'c','ç':'c','Ğ':'g','ğ':'g','Ö':'o','ö':'o','Ş':'s','ş':'s','Ü':'u','ü':'u','Â':'a','â':'a','Î':'i','î':'i','Û':'u','û':'u'};
  function fold(s){var o='';for(var i=0;i<s.length;i++){var c=s.charAt(i),m=MAP[c];if(m){o+=m;continue}var l=c.toLowerCase();o+=(l.length===1?l:c)}return o}
  function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
  var items=null,res=[],words=[],sel=-1,flashT=0,qT=0;
  function ownText(el){var t='';for(var n=el.firstChild;n;n=n.nextSibling){if(n.nodeType===3)t+=n.nodeValue;else if(n.nodeType===1&&n.tagName!=='UL'&&n.tagName!=='OL'&&n.tagName!=='P')t+=n.textContent}return t}
  function build(){
    items=[];var h1='',h2='',els=document.querySelector('main').querySelectorAll('h1,h2,h3,h4,p,li,tr');
    for(var i=0;i<els.length;i++){var el=els[i],tag=el.tagName,text;
      if(el.closest('.mtoc,.filt'))continue;
      if(tag==='TR'){if(el.parentNode.tagName==='THEAD')continue;var c=el.children,a=[];for(var j=0;j<c.length;j++)a.push(c[j].textContent.trim());text=a.join(' · ')}
      else if(tag==='LI')text=ownText(el);else text=el.textContent;
      text=text.replace(/\s+/g,' ').trim();if(!text)continue;
      if(tag==='H1'){h1=text;h2=''}else if(tag==='H2')h2=text;
      items.push({el:el,t:text,f:fold(text),h:/^H[1-4]$/.test(tag),c:tag==='H1'?'':(h1+(h2&&tag!=='H2'?' › '+h2:''))});
    }
  }
  function ranges(f,ws){var r=[],m=[],i;for(var w=0;w<ws.length;w++){var p=0,k;while((k=f.indexOf(ws[w],p))>=0){r.push([k,k+ws[w].length]);p=k+ws[w].length}}
    r.sort(function(x,y){return x[0]-y[0]});for(i=0;i<r.length;i++){var l=m[m.length-1];if(l&&r[i][0]<=l[1])l[1]=Math.max(l[1],r[i][1]);else m.push([r[i][0],r[i][1]])}return m}
  function hl(s,f,ws){var m=ranges(f,ws),o='',p=0;for(var i=0;i<m.length;i++){o+=esc(s.slice(p,m[i][0]))+'<mark>'+esc(s.slice(m[i][0],m[i][1]))+'</mark>';p=m[i][1]}return o+esc(s.slice(p))}
  function snippet(it){var pos=-1;for(var w=0;w<words.length;w++){var p=it.f.indexOf(words[w]);if(p>=0&&(pos<0||p<pos))pos=p}
    if(pos<0)pos=0;var a=Math.max(0,pos-50),b=Math.min(it.t.length,pos+130);
    return (a>0?'…':'')+hl(it.t.slice(a,b),it.f.slice(a,b),words)+(b<it.t.length?'…':'')}
  function setCount(){cnt.textContent=res.length?((sel>=0?(sel+1)+' / ':'')+res.length+' sonuç'):(inp.value.trim().length>=2?'Sonuç yok':'')}
  var LIM=150;
  function render(){
    if(!res.length){out.innerHTML=inp.value.trim().length>=2?'<div class="more">Bu sözcüklerin hepsini içeren bir yer bulunamadı. Daha az ya da farklı sözcük dene.</div>':'';out.hidden=!out.innerHTML;setCount();return}
    var h='',n=Math.min(LIM,res.length);
    for(var i=0;i<n;i++){var it=res[i].it;h+='<button type="button" data-i="'+i+'"'+(i===sel?' class="on"':'')+'>'+(it.c?'<span class="ctx">'+esc(it.c)+'</span>':'')+'<span'+(it.h?' class="hd"':'')+'>'+snippet(it)+'</span></button>'}
    if(res.length>n)h+='<div class="more">İlk '+n+' sonuç gösteriliyor; aramayı daraltmak için bir sözcük daha ekle.</div>';
    out.innerHTML=h;out.hidden=false;setCount();
  }
  function run(){
    clearMarks();var q=inp.value.trim();res=[];sel=-1;
    if(q.length<2){render();return}
    if(!items)build();
    words=fold(q).split(/\s+/).filter(Boolean);var phrase=words.join(' '),hits=[];
    for(var i=0;i<items.length;i++){var it=items[i],ok=true;for(var w=0;w<words.length;w++)if(it.f.indexOf(words[w])<0){ok=false;break}
      if(ok)hits.push({it:it,r:(it.h?0:2)+(it.f.indexOf(phrase)>=0?0:1),i:i})}
    hits.sort(function(a,b){return a.r-b.r||a.i-b.i});res=hits;render();
  }
  function clearMarks(){var ms=document.querySelectorAll('mark.gm');for(var i=0;i<ms.length;i++){var m=ms[i],p=m.parentNode;if(!p)continue;p.replaceChild(document.createTextNode(m.textContent),m);p.normalize()}
    var fl=document.querySelectorAll('.gflash');for(i=0;i<fl.length;i++)fl[i].classList.remove('gflash')}
  function markEl(el){var tn=[],w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null),n;while((n=w.nextNode()))tn.push(n);
    for(var i=0;i<tn.length;i++){var t=tn[i].nodeValue,m=ranges(fold(t),words);if(!m.length)continue;var fr=document.createDocumentFragment(),p=0;
      for(var j=0;j<m.length;j++){if(m[j][0]>p)fr.appendChild(document.createTextNode(t.slice(p,m[j][0])));var k=document.createElement('mark');k.className='gm';k.textContent=t.slice(m[j][0],m[j][1]);fr.appendChild(k);p=m[j][1]}
      if(p<t.length)fr.appendChild(document.createTextNode(t.slice(p)));tn[i].parentNode.replaceChild(fr,tn[i])}}
  function go(n){
    if(!res.length)return;if(n<0)n=res.length-1;if(n>=res.length)n=0;sel=n;
    var bs=out.querySelectorAll('button'),b=null;for(var i=0;i<bs.length;i++){var on=(+bs[i].getAttribute('data-i'))===n;bs[i].classList.toggle('on',on);if(on)b=bs[i]}
    if(b&&!out.hidden)b.scrollIntoView({block:'nearest'});setCount();
    var el=res[n].it.el,wait=0;
    if(el.classList.contains('hide')){var tw=el.closest('.tw'),fi=tw&&document.querySelector('.filt input[data-t="'+tw.id+'"]');if(fi){fi.value='';fi.dispatchEvent(new Event('input'));wait=180}}
    clearTimeout(flashT);
    setTimeout(function(){clearMarks();markEl(el);el.classList.add('gflash');el.scrollIntoView({block:'center'});flashT=setTimeout(function(){el.classList.remove('gflash')},2400)},wait);
    if(window.innerWidth<=900)out.hidden=true;
  }
  inp.addEventListener('input',function(){clearTimeout(qT);qT=setTimeout(run,140)});
  inp.addEventListener('focus',function(){if(out.innerHTML)out.hidden=false});
  inp.addEventListener('keydown',function(e){
    if(e.key==='ArrowDown'){e.preventDefault();go(sel+1)}
    else if(e.key==='ArrowUp'){e.preventDefault();go(sel<0?res.length-1:sel-1)}
    else if(e.key==='Enter'){e.preventDefault();clearTimeout(qT);if(!res.length||(inp.value.trim().length>=2&&!out.innerHTML))run();go(e.shiftKey?sel-1:sel+1)}
    else if(e.key==='Escape'){if(!out.hidden)out.hidden=true;else{inp.value='';run();inp.blur()}}
  });
  out.addEventListener('click',function(e){var b=e.target.closest('button[data-i]');if(b)go(+b.getAttribute('data-i'))});
  document.getElementById('gsn').addEventListener('click',function(){go(sel+1)});
  document.getElementById('gsp').addEventListener('click',function(){go(sel<0?res.length-1:sel-1)});
  document.getElementById('gsx').addEventListener('click',function(){inp.value='';run();inp.focus()});
  document.addEventListener('click',function(e){if(!gs.contains(e.target))out.hidden=true});
  document.addEventListener('keydown',function(e){
    var t=e.target,typing=t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable);
    if((e.key==='/'&&!typing&&!e.ctrlKey&&!e.metaKey&&!e.altKey)||((e.ctrlKey||e.metaKey)&&(e.key==='k'||e.key==='K'))){e.preventDefault();inp.focus();inp.select()}});
})();
</script>
